<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاهزه 😉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffe6eb;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* القلوب المتحركة أو الديكور في الخلفية */
        .hearts-bg {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 15px;
            font-size: 24px;
            animation: bounce 2s infinite alternate;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
        }
        .img-container img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff4d6d;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }
        h1 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            font-size: 20px;
            font-weight: 500;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- قلوب الديكور -->
    <div class="hearts-bg">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💖</span>
        <span>💗</span>
    </div>

    <div class="card">
        <div class="img-container">
            <!-- حط رابط صورتك هنا مكان رابط Cloudinary -->
            <img src="https://res.cloudinary.com/dvc3zpg1i/image/upload/v1777667717/clients/mszernngoubvptsh3r52.jpg" alt="photo">
        </div>
        
        <h1>جاهزه 😉</h1>
        <p>كل الي بينا هنا 😍</p>
    </div>

</body>
</html>
